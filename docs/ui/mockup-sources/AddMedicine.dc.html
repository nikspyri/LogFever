<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Add medicine</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap">
<style>
body{margin:0}
a{text-decoration:none;color:inherit}
button,input{font-family:'Figtree',system-ui,sans-serif}
button{cursor:pointer}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:#F3F6F5;color:#12302C;font-family:'Figtree',system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden;padding:20px;gap:10px;position:relative">

  <div style="display:flex;align-items:center;gap:12px;height:56px;flex-shrink:0">
    <a href="LogDose.dc.html" aria-label="Back" style="width:56px;height:56px;border-radius:28px;background:#fff;border:1px solid #D5E0DD;box-sizing:border-box;display:flex;align-items:center;justify-content:center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#12302C" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></a>
    <div style="font-size:22px;font-weight:700">Add medicine</div>
  </div>

  <label style="display:flex;flex-direction:column;gap:4px;flex-shrink:0">
    <span style="font-size:14px;font-weight:600;color:#4F6662;letter-spacing:.02em">NAME ON THE BOX</span>
    <input type="text" placeholder="e.g. brand name" style="height:56px;box-sizing:border-box;border-radius:16px;border:1px solid #C9D6D3;background:#fff;padding:0 16px;font-size:17px;color:#12302C">
  </label>

  <div style="position:relative;flex-shrink:0">
    <button onClick="{{toggleIng}}" aria-haspopup="listbox" aria-expanded="{{ingOpen}}" style="width:100%;min-height:64px;border-radius:16px;border:2px solid #1B645C;background:#fff;padding:6px 14px;display:flex;align-items:center;gap:10px;text-align:start;color:#12302C">
      <span style="flex-grow:1"><span style="display:block;font-size:13px;color:#4F6662">Active ingredient</span><span style="display:block;font-size:19px;font-weight:700">{{ingLabel}}</span></span>
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#1B645C" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="transform:rotate({{chevRot}})"><path d="M6 9l6 6 6-6"/></svg>
    </button>
    <sc-if value="{{ingOpen}}" hint-placeholder-val="{{false}}">
      <div role="listbox" aria-label="Active ingredients" style="position:absolute;top:70px;inset-inline:0;z-index:5;background:#fff;border:2px solid #1B645C;border-radius:16px;box-shadow:0 8px 20px rgba(0,0,0,.2);overflow:hidden">
        <sc-for list="{{ings}}" as="i" hint-placeholder-count="3">
          <button role="option" aria-selected="{{i.on}}" onClick="{{i.pick}}" style="width:100%;min-height:56px;border:0;border-bottom:1px solid #E4ECEA;background:{{i.bg}};padding:0 16px;display:flex;align-items:center;text-align:start;font-size:17px;font-weight:700;color:#12302C"><span style="flex-grow:1">{{i.label}}</span><span style="color:#1B645C;font-size:20px">{{i.mark}}</span></button>
        </sc-for>
      </div>
    </sc-if>
  </div>

  <div style="display:flex;flex-direction:column;gap:4px;flex-shrink:0">
    <div style="font-size:14px;font-weight:600;color:#4F6662;letter-spacing:.02em">FORM</div>
    <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px">
      <sc-for list="{{forms}}" as="f" hint-placeholder-count="2">
        <button onClick="{{f.pick}}" aria-pressed="{{f.on}}" style="height:56px;border-radius:16px;font-size:17px;font-weight:700;border:2px solid #1B645C;background:{{f.bg}};color:{{f.ink}}">{{f.label}}</button>
      </sc-for>
    </div>
  </div>

  <div style="background:#fff;border:1px solid #D5E0DD;border-radius:18px;padding:12px 14px;display:flex;align-items:center;gap:14px;flex-shrink:0">
    <div style="width:72px;height:72px;border-radius:16px;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:{{photoBg}};border:2px {{photoBorder}} #7A8F8B;box-sizing:border-box;color:#1B645C">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{photoIcon}}"/></svg>
    </div>
    <div style="flex-grow:1;display:flex;flex-direction:column;gap:6px">
      <div style="font-size:15px;font-weight:700">{{photoTitle}}</div>
      <div style="display:flex;gap:8px">
        <button onClick="{{takePhoto}}" style="height:44px;flex-grow:1;border-radius:12px;border:2px solid #1B645C;background:#fff;color:#1B645C;font-size:14px;font-weight:700">{{photoBtn}}</button>
        <sc-if value="{{hasPhoto}}" hint-placeholder-val="{{false}}"><button onClick="{{removePhoto}}" style="height:44px;border-radius:12px;border:2px solid #7A8F8B;background:#fff;color:#12302C;font-size:14px;font-weight:600;padding:0 12px">Remove</button></sc-if>
      </div>
    </div>
  </div>

  <div style="background:#fff;border:1px solid #D5E0DD;border-radius:18px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;flex-shrink:0">
    <div style="display:flex;align-items:center;justify-content:space-between;gap:10px">
      <div>
        <div style="font-size:13px;color:#4F6662">Dose on the label</div>
        <div style="font-size:26px;font-weight:700;line-height:1.1" aria-live="polite">{{doseTxt}} <span style="font-size:17px;font-weight:600">{{doseUnit}}</span></div>
      </div>
      <div style="display:flex;gap:8px">
        <button onClick="{{doseLess}}" aria-label="Decrease label dose" style="width:56px;height:56px;border-radius:16px;border:2px solid #1B645C;background:#fff;color:#1B645C;font-size:26px;font-weight:700;padding:0">−</button>
        <button onClick="{{doseMore}}" aria-label="Increase label dose" style="width:56px;height:56px;border-radius:16px;border:0;background:#1B645C;color:#fff;font-size:26px;font-weight:700;padding:0">+</button>
      </div>
    </div>
    <div style="font-size:13px;line-height:1.35;color:#4F6662">Copy it from the label or from your doctor. The app only stores it as a reference and never suggests a dose.</div>
  </div>

  <div style="background:#fff;border:1px solid #D5E0DD;border-radius:18px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;flex-shrink:0">
    <div style="display:flex;align-items:center;justify-content:space-between;gap:10px">
      <div>
        <div style="font-size:13px;color:#4F6662">Minimum time between doses</div>
        <div style="font-size:26px;font-weight:700;line-height:1.1" aria-live="polite">{{hours}} <span style="font-size:17px;font-weight:600">h</span></div>
      </div>
      <div style="display:flex;gap:8px">
        <button onClick="{{hLess}}" aria-label="Decrease minimum time" style="width:56px;height:56px;border-radius:16px;border:2px solid #1B645C;background:#fff;color:#1B645C;font-size:26px;font-weight:700;padding:0">−</button>
        <button onClick="{{hMore}}" aria-label="Increase minimum time" style="width:56px;height:56px;border-radius:16px;border:0;background:#1B645C;color:#fff;font-size:26px;font-weight:700;padding:0">+</button>
      </div>
    </div>
    <div style="font-size:13px;line-height:1.35;color:#4F6662">From the label or your doctor. Used for the next-dose timer.</div>
  </div>

  <a href="LogDose.dc.html" style="margin-top:auto;height:64px;border-radius:20px;background:#1B645C;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px;flex-shrink:0">Save medicine</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { ing: 'paracetamol', ingOpen: false, form: 'syrup', photo: false, dose: 5, hours: 6 }; }
  renderVals() {
    // Sample values only. In the app these start empty and the user types what the label says.
    const st = this.state;
    const INGS = [['paracetamol','Paracetamol'],['ibuprofen','Ibuprofen'],['other','Other…']];
    const ings = INGS.map(([k, label]) => ({ label, on: st.ing === k, mark: st.ing === k ? '✓' : '', bg: st.ing === k ? '#E8F1EF' : '#fff',
      pick: () => this.setState({ ing: k, ingOpen: false }) }));
    const forms = [['syrup','Syrup'],['pills','Pills']].map(([k, label]) => ({ label, on: st.form === k,
      bg: st.form === k ? '#1B645C' : '#fff', ink: st.form === k ? '#fff' : '#1B645C',
      pick: () => this.setState({ form: k, dose: k === 'pills' ? 1 : 5 }) }));
    return {
      ings, forms,
      ingLabel: INGS.find(x => x[0] === st.ing)[1], ingOpen: st.ingOpen, chevRot: st.ingOpen ? '180deg' : '0deg',
      toggleIng: () => this.setState({ ingOpen: !st.ingOpen }),
      hasPhoto: st.photo,
      photoBg: st.photo ? '#E8F1EF' : '#fff', photoBorder: st.photo ? 'solid' : 'dashed',
      photoIcon: st.photo ? 'M5 12l5 5L20 7' : 'M4 8h3l2-3h6l2 3h3v11H4zM12 17a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7z',
      photoTitle: st.photo ? 'Photo added · stays on this phone' : 'Photo of the box (optional)',
      photoBtn: st.photo ? 'Retake' : 'Take photo',
      takePhoto: () => this.setState({ photo: true }),
      removePhoto: () => this.setState({ photo: false }),
      doseTxt: String(+st.dose.toFixed(1)),
      doseUnit: st.form === 'pills' ? (st.dose === 1 ? 'pill' : 'pills') : 'ml',
      doseLess: () => this.setState({ dose: Math.max(0.5, st.dose - 0.5) }),
      doseMore: () => this.setState({ dose: st.dose + 0.5 }),
      hours: String(st.hours),
      hLess: () => this.setState({ hours: Math.max(1, st.hours - 1) }),
      hMore: () => this.setState({ hours: Math.min(24, st.hours + 1) })
    };
  }
}
</script>
</body>
</html>
