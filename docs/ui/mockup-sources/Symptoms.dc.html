<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Log symptoms</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap">
<style>
body{margin:0}
a{text-decoration:none;color:inherit}
button{font-family:'Figtree',system-ui,sans-serif;cursor:pointer}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:#F3F6F5;color:#12302C;font-family:'Figtree',system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden;padding:20px;gap:16px">
  <div style="display:flex;align-items:center;gap:12px;height:56px">
    <a href="Main.dc.html" aria-label="Back" style="width:56px;height:56px;border-radius:28px;background:#fff;border:1px solid #D5E0DD;box-sizing:border-box;display:flex;align-items:center;justify-content:center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#12302C" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></a>
    <div style="font-size:22px;font-weight:700">Log symptoms</div>
  </div>
  <div style="display:flex;align-items:center;gap:10px;background:#E8F1EF;border-radius:16px;padding:12px 14px">
    <span style="width:36px;height:36px;border-radius:18px;background:#1B645C;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700">M</span>
    <span style="font-size:15px;color:#4F6662">Logging for</span><span style="font-size:17px;font-weight:700">Maya</span>
  </div>
  <div style="font-size:14px;font-weight:600;color:#4F6662;letter-spacing:.02em">SELECT ALL THAT APPLY</div>
  <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px">
    <sc-for list="{{items}}" as="s" hint-placeholder-count="8">
      <button onClick="{{s.toggle}}" aria-pressed="{{s.on}}" style="min-height:60px;border-radius:16px;padding:8px 12px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:16px;font-weight:600;border:2px solid {{s.border}};background:{{s.bg}};color:#12302C">
        <sc-if value="{{s.on}}" hint-placeholder-val="{{false}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1B645C" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg></sc-if>
        {{s.label}}
      </button>
    </sc-for>
  </div>
  <div style="min-height:80px;background:#fff;border:1px solid #C9D6D3;border-radius:16px;padding:14px 16px;font-size:16px;color:#4F6662">Add a note (optional)</div>
  <a href="Main.dc.html" style="margin-top:auto;height:64px;border-radius:20px;background:#1B645C;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px">Save for Maya</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { sel: ['cough'] }; }
  renderVals() {
    const all = [['cough','Cough'],['runny','Runny nose'],['vomiting','Vomiting'],['diarrhea','Diarrhea'],['rash','Rash'],['earache','Earache'],['sore','Sore throat'],['tired','Unusually tired']];
    return { items: all.map(([k, label]) => {
      const on = this.state.sel.includes(k);
      return { label, on, border: on ? '#1B645C' : '#C9D6D3', bg: on ? '#E8F1EF' : '#fff',
        toggle: () => this.setState({ sel: on ? this.state.sel.filter(x => x !== k) : [...this.state.sel, k] }) };
    }) };
  }
}
</script>
</body>
</html>
