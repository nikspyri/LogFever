<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap">
<style>
body{margin:0}

<div style="width:390px;height:844px;box-sizing:border-box;background:#F3F6F5;color:#12302C;font-family:'Figtree',system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden">
  <div style="padding:20px 20px 0;display:flex;flex-direction:column;gap:12px;flex-grow:1">
    <div style="display:flex;align-items:center;height:56px"><div style="font-size:26px;font-weight:700">Settings</div></div>

    <div style="font-size:14px;font-weight:600;color:#4F6662;letter-spacing:.02em">GENERAL</div>
    <div style="background:#fff;border:1px solid #D5E0DD;border-radius:20px;display:flex;flex-direction:column">
      <div style="min-height:60px;padding:0 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #E4ECEA"><span style="font-size:17px;font-weight:600">Language</span><span style="font-size:16px;color:#4F6662">English</span></div>
      <div style="min-height:60px;padding:0 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #E4ECEA"><span style="font-size:17px;font-weight:600">Country</span><span style="font-size:16px;color:#4F6662">[Country]</span></div>
      <div style="min-height:60px;padding:0 16px;display:flex;align-items:center;justify-content:space-between"><span style="font-size:17px;font-weight:600">Temperature unit</span>
        <span style="display:flex;border:2px solid #1B645C;border-radius:14px;overflow:hidden;font-weight:700;font-size:16px"><span style="padding:8px 16px;background:#1B645C;color:#fff">°C</span><span style="padding:8px 16px;color:#1B645C">°F</span></span></div>
    </div>

    <div style="font-size:14px;font-weight:600;color:#4F6662;letter-spacing:.02em;margin-top:4px">DISPLAY</div>
    <div style="background:#fff;border:1px solid #D5E0DD;border-radius:20px;display:flex;flex-direction:column">
      <div style="min-height:60px;padding:0 16px;display:flex;align-items:center;justify-content:space-between"><span style="font-size:17px;font-weight:600">Theme</span><span style="font-size:16px;color:#4F6662">Light · Dark · Night</span></div>
    </div>

    <div style="font-size:14px;font-weight:600;color:#4F6662;letter-spacing:.02em;margin-top:4px">DATA</div>
    <div style="background:#fff;border:1px solid #D5E0DD;border-radius:20px;display:flex;flex-direction:column">
      <div style="min-height:60px;padding:0 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #E4ECEA"><span style="font-size:17px;font-weight:600">Backup folder</span><span style="font-size:16px;color:#4F6662">Not set</span></div>
      <div style="min-height:60px;padding:0 16px;display:flex;align-items:center;justify-content:space-between"><span style="font-size:17px;font-weight:600">Last backup</span><span style="font-size:16px;color:#4F6662">Never</span></div>
    </div>
    <div style="font-size:13px;line-height:1.4;color:#4F6662">All data stays on this phone. The app has no internet access.</div>
  </div>

  <nav style="height:76px;background:#fff;border-top:1px solid #D5E0DD;display:grid;grid-template-columns:repeat(4,minmax(0,1fr))">
    <a href="Main.dc.html" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:#4F6662;font-weight:600;font-size:13px"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11l8-7 8 7v9H4z"/></svg>Home</a>
    <a href="Timeline.dc.html" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:#4F6662;font-weight:600;font-size:13px"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg>Timeline</a>
    <a href="Contacts.dc.html" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:#4F6662;font-weight:600;font-size:13px"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/></svg>Contacts</a>
    <a href="Settings.dc.html" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:#1B645C;font-weight:700;font-size:13px"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1.3l2-1.5-2-3.4-2.3 1a7 7 0 0 0-2.2-1.3L14 3h-4l-.4 2.5a7 7 0 0 0-2.2 1.3l-2.3-1-2 3.4 2 1.5A7 7 0 0 0 5 12c0 .4 0 .9.1 1.3l-2 1.5 2 3.4 2.3-1a7 7 0 0 0 2.2 1.3L10 21h4l.4-2.5a7 7 0 0 0 2.2-1.3l2.3 1 2-3.4-2-1.5c.1-.4.1-.9.1-1.3z"/></svg>Settings</a>
  </nav>
</div>
</x-dc>

</html>
