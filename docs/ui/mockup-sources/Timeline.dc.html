<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Timeline</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap">
<style>
body{margin:0}
a{text-decoration:none;color:inherit}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:#F3F6F5;color:#12302C;font-family:'Figtree',system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden">

  <div style="padding:20px 20px 0;display:flex;flex-direction:column;gap:14px;flex-grow:1">
    <div style="display:flex;align-items:center;justify-content:space-between;height:56px">
      <div style="font-size:26px;font-weight:700">Timeline</div>
      <div style="display:flex;align-items:center;gap:8px;height:44px;padding:0 14px 0 6px;border-radius:22px;background:#1B645C;color:#fff;font-weight:600;font-size:15px">
        <span style="width:32px;height:32px;border-radius:16px;background:#fff;color:#1B645C;display:flex;align-items:center;justify-content:center;font-weight:700">M</span>Maya
      </div>
    </div>

    <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px">
      <div style="height:44px;border-radius:14px;background:#1B645C;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:15px">All</div>
      <div style="height:44px;border-radius:14px;background:#fff;border:1px solid #C9D6D3;box-sizing:border-box;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:15px">Temperature</div>
      <div style="height:44px;border-radius:14px;background:#fff;border:1px solid #C9D6D3;box-sizing:border-box;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:15px">Doses</div>
    </div>

    <div style="font-size:14px;font-weight:600;color:#4F6662;letter-spacing:.02em;margin-top:4px">TODAY</div>

    <div style="background:#fff;border:1px solid #D5E0DD;border-radius:18px;padding:14px 16px;display:flex;align-items:center;gap:14px;min-height:64px">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#8A3A22" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 14.8V5a2 2 0 0 0-4 0v9.8a4 4 0 1 0 4 0z"/></svg>
      <div style="flex-grow:1">
        <div style="font-size:20px;font-weight:700">38.4 °C <span style="font-size:14px;font-weight:600;color:#8A3A22">· Fever range</span></div>
        <div style="font-size:14px;color:#4F6662">Forehead</div>
      </div>
      <div style="font-size:15px;font-weight:600">14:20</div>
    </div>

    <div style="background:#fff;border:1px solid #D5E0DD;border-radius:18px;padding:14px 16px;display:flex;align-items:center;gap:14px;min-height:64px">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#1B645C" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="9" width="18" height="7" rx="3.5" transform="rotate(-35 12 12.5)"/><path d="M9.5 8.5l6 6"/></svg>
      <div style="flex-grow:1">
        <div style="font-size:20px;font-weight:700">Paracetamol</div>
        <div style="font-size:14px;color:#4F6662">7.5 ml · recorded as given</div>
      </div>
      <div style="font-size:15px;font-weight:600">12:50</div>
    </div>

    <div style="background:#fff;border:1px solid #D5E0DD;border-radius:18px;padding:14px 16px;display:flex;align-items:center;gap:14px;min-height:64px">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#8A3A22" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 14.8V5a2 2 0 0 0-4 0v9.8a4 4 0 1 0 4 0z"/></svg>
      <div style="flex-grow:1">
        <div style="font-size:20px;font-weight:700">38.9 °C <span style="font-size:14px;font-weight:600;color:#8A3A22">· Fever range</span></div>
        <div style="font-size:14px;color:#4F6662">Ear</div>
      </div>
      <div style="font-size:15px;font-weight:600">12:40</div>
    </div>

    <div style="font-size:14px;font-weight:600;color:#4F6662;letter-spacing:.02em;margin-top:4px">YESTERDAY</div>

    <div style="background:#fff;border:1px solid #D5E0DD;border-radius:18px;padding:14px 16px;display:flex;align-items:center;gap:14px;min-height:64px">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#1B645C" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 14.8V5a2 2 0 0 0-4 0v9.8a4 4 0 1 0 4 0z"/></svg>
      <div style="flex-grow:1">
        <div style="font-size:20px;font-weight:700">37.2 °C <span style="font-size:14px;font-weight:600;color:#1B645C">· Below fever range</span></div>
        <div style="font-size:14px;color:#4F6662">Forehead</div>
      </div>
      <div style="font-size:15px;font-weight:600">21:30</div>
    </div>
  </div>

  <div style="margin:0 20px 12px;background:#12302C;color:#fff;border-radius:16px;min-height:56px;padding:0 18px;display:flex;align-items:center;justify-content:space-between;font-size:15px">
    <span>Entry deleted</span><span style="font-weight:700;text-decoration:underline">Undo</span>
  </div>

  <nav style="height:76px;background:#fff;border-top:1px solid #D5E0DD;display:grid;grid-template-columns:repeat(4,minmax(0,1fr))">
    <a href="Main.dc.html" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:#4F6662;font-weight:600;font-size:13px">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11l8-7 8 7v9H4z"/></svg>Home</a>
    <a href="Timeline.dc.html" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:#1B645C;font-weight:700;font-size:13px">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg>Timeline</a>
    <a href="Contacts.dc.html" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:#4F6662;font-weight:600;font-size:13px">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/></svg>Contacts</a>
    <a href="Onboarding.dc.html" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:#4F6662;font-weight:600;font-size:13px">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1.3l2-1.5-2-3.4-2.3 1a7 7 0 0 0-2.2-1.3L14 3h-4l-.4 2.5a7 7 0 0 0-2.2 1.3l-2.3-1-2 3.4 2 1.5A7 7 0 0 0 5 12c0 .4 0 .9.1 1.3l-2 1.5 2 3.4 2.3-1a7 7 0 0 0 2.2 1.3L10 21h4l.4-2.5a7 7 0 0 0 2.2-1.3l2.3 1 2-3.4-2-1.5c.1-.4.1-.9.1-1.3z"/></svg>Settings</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
